# Xiaomi 10S (thyme): Snapdragon 870 (SM8250), Linux 4.19, Virtual A/B
# with recovery carried inside vendor_boot and HIDL keymaster@4.0 /
# gatekeeper@1.0.

[device]
codename = "thyme"
brand = "Xiaomi"
model = "Mi 10S"
recovery_partition = "vendor_boot"
init_boot = false
recovery = false
keep_recovery = false
soc = { en = "Qualcomm® Snapdragon™ 870 5G Mobile Platform", hans = "高通骁龙™ 870 移动平台", hant = "高通驍龍™ 870 行動平台" }
os_version_prop = "ro.mi.os.version.incremental"
maintainer = "Flicker372"

[display]
width = 1080
height = 2340
density = 440
diagonal = 6.67
corner_radius = 104
# Extra dp insets on top of the stock layout to clear the top-left camera
# cutout (102..164 px) and match the panel's AOSP status bar margins.
status_bar = { start = 28.0, top = -4.6, end = 6.0 }

# Touchscreen and USB drivers are built into the 4.19 kernel.
[modules]

[firmware]
partition = "modem"

[partitions]
mounted = ["persist"]

# Configure CPU governors, scheduling, and thermal policy as stock vendor init does.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.qcom.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true

# Configure devfreq DCVS governors (triggered by vendor.dcvs.prop=1 in init.target.rc).
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.qti.dcvs.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
user = "root"
groups = ["root", "system"]
oneshot = true

# Userspace QRTR nameserver and CNSS daemon needed on Linux 4.19 for QMI WLFW discovery on QCA6390.
[[service]]
path = "/vendor/bin/qrtr-ns"
args = ["-f"]
libraries = ["/system/lib64", "/vendor/lib64"]
user = "vendor_qrtr"
groups = ["vendor_qrtr"]
capabilities = ["NET_BIND_SERVICE"]

[[service]]
path = "/vendor/bin/sh"
args = ["-c", "/vendor/bin/mkdir -p /data/vendor/wifi/sockets && /vendor/bin/chmod 0770 /data/vendor/wifi /data/vendor/wifi/sockets && /vendor/bin/chown system:wifi /data/vendor/wifi /data/vendor/wifi/sockets"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true

[[service]]
path = "/vendor/bin/cnss-daemon"
args = ["-n", "-l"]
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "inet", "net_admin", "wifi"]
capabilities = ["NET_ADMIN"]

# Authenticate the BMS fuel gauge and USB-PD adapter so fast charging stays unlocked.
[[service]]
path = "/vendor/bin/batterysecret"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "root"
groups = ["system", "wakelock"]

# AW8697 haptic driver supports preset RAM waveforms (< vib_effect_id_boundary = 10)
# rather than arbitrary sample streaming.
[haptics]
click = 0
ticks = 2
strength = { lightest = 0.25, strongest = 1.0 }

# Built-in QCA6390 WLAN over CNSS PCIe. Setting fs_ready starts cold-boot
# calibration, and writing ON to /dev/wlan triggers hdd_driver_load to create wlan0.
[wlan]
modules = []
writes = [
    { path = "/sys/devices/platform/soc/b0000000.qcom,cnss-qca6390/fs_ready", value = "1" },
    { path = "/dev/wlan", value = "ON\n" },
]
firmware = [
    { name = "wlan/qca_cld/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/wlan_mac.bin", path = "/mnt/vendor/persist/wlan_mac.bin", optional = true },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

[update]
server = "https://update.miui.com/updates/miotaV3.php"
official = "https://cdnorg.d.miui.com/OS1.0.4.0.TGACNXM/miui_THYME_OS1.0.4.0.TGACNXM_80dbab1cd4_13.0.zip"
rom = "https://sourceforge.net/projects/flickerdev/files/ROM/"
firmware = "https://sourceforge.net/projects/flickerdev/files/Firmware/thyme/"

[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/fingerprint", "vendor/fpc", "vendor/goodix"]

[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/bsplog",
    "/data/vendor/wlan_logs",
]
